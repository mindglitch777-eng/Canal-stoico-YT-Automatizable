# Prueba de plantillas: typecheck, un cuadro por escena, hoja de contactos y video de muestra sin voz.
# Se dispara solo al cambiar algo en remotion/ o a mano desde la pestaña Actions.
name: Prueba de plantillas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "remotion/**"
      - ".github/workflows/test-templates.yml"

concurrency:
  group: test-templates
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Cuadros de cada plantilla
        run: npm run test:templates -- --at 0.15,0.5,0.9
      - name: Video de muestra (sin voz)
        run: npm run render -- --demo
      - uses: actions/upload-artifact@v4
        with:
          name: prueba-plantillas
          path: |
            remotion/out/stills/
            remotion/out/demo.mp4
          retention-days: 14
      - name: Publicar en la rama salidas
        working-directory: .
        run: |
          mkdir -p prueba && cp remotion/out/demo.mp4 prueba/ && cp remotion/out/stills/contact-sheet.png prueba/
          bash tools/publish_outputs.sh prueba "plantillas/run-${{ github.run_number }}" "Prueba de plantillas (run ${{ github.run_id }})"
